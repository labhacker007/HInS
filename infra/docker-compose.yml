# HInS local development stack — Phase 00 (Foundations).
#
# Brings up: the confirmed EMR/EHR core (Medplum, self-hosted), and the
# candidate Identity/IAM service (Keycloak) from the platform blueprint
# (docs/PLATFORM_BLUEPRINT.md §06, §07, §10).
#
# All credentials below are fixed, well-known defaults for LOCAL DEV ONLY —
# never reuse them anywhere reachable outside your machine.
#
# Usage:
#   docker compose -f infra/docker-compose.yml up -d
#   Medplum app:      http://localhost:3000  (first run prompts you to register)
#   Medplum API:      http://localhost:8103
#   Keycloak admin:   http://localhost:8080  (admin / admin)
#   HInS services DB: postgres://hins:hins@localhost:5433/hins  (pgvector enabled)
#
# The medplum-server block is adapted from medplum/medplum's own
# docker-compose.full-stack.yml (https://github.com/medplum/medplum, Apache-2.0),
# with two fixes needed to actually get it running:
#   1. Their file pins `command: ['env']` on medplum-server, which overrides
#      the image's own entrypoint and makes the container print its
#      environment and exit instead of serving. Dropped, so the image's
#      default entrypoint runs.
#   2. That default entrypoint takes no config-path argument, so the server
#      falls back to a relative `medplum.config.json` in its working
#      directory (/usr/src/medplum) and crashes with ENOENT if that file
#      doesn't exist — true even though MEDPLUM_* env vars, once the file
#      load succeeds, take precedence over anything inside it. Fixed by
#      bind-mounting ./medplum.config.json (deliberately near-empty — the
#      env vars below are what actually configure the server).
#
# postgres-hins is a SEPARATE Postgres instance from Medplum's own, on
# purpose (docs §06, Decisions log): our own services (consent-service,
# terminology-service, ...) own their data independently of whatever
# version/schema Medplum's image requires, so Medplum's postgres stays
# pinned to the version it ships tested against (16) while our services get
# current Postgres (18 — async I/O, UUIDv7) with pgvector built in for the
# embeddings/RAG work in docs §08 (CDSS groundedness checks, semantic
# search). Image is pgvector/pgvector:pg18 — the pgvector project's own
# Postgres-18 build, not a custom Dockerfile.

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      - POSTGRES_USER=medplum
      - POSTGRES_PASSWORD=medplum
    volumes:
      - medplum-postgres-data:/var/lib/postgresql/data
    command:
      - 'postgres'
      - '-c'
      - 'listen_addresses=*'
      - '-c'
      - 'statement_timeout=60000'
      - '-c'
      - 'default_transaction_isolation=REPEATABLE READ'
      - '-c'
      - 'shared_preload_libraries=pg_stat_statements,auto_explain'
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U medplum']
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-hins:
    image: pgvector/pgvector:pg18
    restart: unless-stopped
    environment:
      - POSTGRES_USER=hins
      - POSTGRES_PASSWORD=hins
      - POSTGRES_DB=hins
    # Postgres 18's image moved to a major-version-namespaced data layout —
    # the single mount point is /var/lib/postgresql now, not
    # /var/lib/postgresql/data like postgres:16 above.
    volumes:
      - hins-postgres-data:/var/lib/postgresql
    ports:
      - '5433:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U hins']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    restart: unless-stopped
    command: redis-server --requirepass medplum
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', 'medplum', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  # Confirmed EMR/EHR core (docs/PLATFORM_BLUEPRINT.md — Decisions log, 2026-10-15)
  medplum-server:
    image: medplum/medplum-server:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - '8103:8103'
    volumes:
      # The real config lives in this file, not env vars — see the fix #2
      # note above. VM-context Bot runtime (vmContextBotsEnabled) runs Bots
      # (docs §08.2) in-process, no AWS Lambda needed for local dev.
      - ./medplum.config.json:/usr/src/medplum/medplum.config.json:ro
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          'fetch("http://localhost:8103/healthcheck").then(r => r.json()).then(console.log).catch(() => { process.exit(1); })',
        ]
      interval: 30s
      timeout: 10s
      retries: 5

  medplum-app:
    image: medplum/medplum-app:latest
    restart: unless-stopped
    depends_on:
      medplum-server:
        condition: service_healthy
    ports:
      - '3000:3000'
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:3000']
      interval: 10s
      timeout: 5s
      retries: 5

  # Identity/IAM candidate (docs/PLATFORM_BLUEPRINT.md §10). Dev mode only
  # (start-dev) — not the production-hardened startup command.
  keycloak:
    image: quay.io/keycloak/keycloak:26.8
    restart: unless-stopped
    command: start-dev
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports:
      - '8080:8080'

volumes:
  medplum-postgres-data:
  hins-postgres-data:
